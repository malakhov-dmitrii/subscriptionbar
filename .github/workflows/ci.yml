name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # macOS 14 is the deployment target, but its runner image ships Swift 5.10
    # and Package.swift needs tools 6.0, so build on a newer image.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show toolchain
        run: swift --version && node --version

      - name: Verify
        run: scripts/verify.sh

      - name: Package the app
        run: scripts/package-app.sh

      - name: Check the bundle carries what the installer needs
        run: |
          test -x dist/SubscriptionBar.app/Contents/MacOS/SubscriptionBar
          test -d dist/SubscriptionBar.app/Contents/Resources/browser-extension/firefox
          test -f dist/SubscriptionBar.app/Contents/Resources/install-browser-host.command
