<!doctype html>
<html lang="en"><meta charset="utf-8"><title>SubscriptionBar</title>
<style>
body{font:13px system-ui;width:320px;padding:14px;margin:0;color:#20212a;background:#f7f7fa}
h1{font-size:15px;margin:0 0 10px}
select,button{width:100%;padding:8px;margin-top:6px;font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
label{display:block;margin-top:14px;font-weight:600}
p{line-height:1.45;margin:6px 0 0;color:#525766}
#status{display:flex;gap:7px;align-items:flex-start;margin:0;padding:8px 10px;border-radius:8px;
  background:#ececf1;color:#20212a;font-weight:500}
#status[data-state="ok"]{background:#e3f5e8}
#status[data-state="warn"]{background:#fdf0dd}
#status[data-state="error"]{background:#fbe4e4}
#dot{width:8px;height:8px;border-radius:50%;background:#8a8f9c;margin-top:5px;flex:0 0 auto}
#status[data-state="ok"] #dot{background:#1f9a4d}
#status[data-state="warn"] #dot{background:#c77b12}
#status[data-state="error"] #dot{background:#c0392b}
#site{font-variant:tabular-nums}
footer{margin-top:16px;padding-top:10px;border-top:1px solid #e0e1e7}
footer label{margin-top:0;font-weight:400}
</style>
<h1>SubscriptionBar</h1>
<p id="status" role="status" aria-live="polite"><span id="dot" aria-hidden="true"></span><span id="statusText"></span></p>
<label for="account" data-i18n="account"></label>
<select id="account"></select>
<p id="site"></p>
<p data-i18n="captureHelp"></p>
<button id="capture" disabled data-i18n="capture"></button>
<p data-i18n="autoHelp"></p>
<footer>
  <label for="language" data-i18n="language"></label>
  <select id="language"><option value="ru" lang="ru">Русский</option><option value="en" lang="en">English</option></select>
</footer>
<script type="module" src="popup.js"></script></html>
